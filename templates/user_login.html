{% extends 'base.html' %}

{% block content %}
<div class="card p-4 shadow-sm">
    <h2>Login account</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}
        <p>
            <button type="submit" class="btn btn-primary mt-3">Login</button>
            <a class="btn btn-primary mt-3" href="{% url 'user_register' %}">Don't have an Account?</a>
        </p>
    </form>
</div>
{% endblock %}
