<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>{{page}}</title>
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        form p input, 
        form p select { width: 100%; padding: 0.375rem 0.75rem; font-size: 1rem;
        font-weight: 400; line-height: 1.5; color: #212529; background-color: #fff;
        border: 1px solid #ced4da; border-radius: 0.375rem; margin-top: 5px; margin-bottom: 15px; }
    </style>
    <style>
    /* 🖨️ প্রিন্ট লেআউট পলিসি (প্রিন্ট এবং পিডিএফ করার সময় বাটনগুলো লুকিয়ে যাবে) */
    @media print {
        .resume-actions { display: none !important; }
        body { background: #fff; padding: 0; margin: 0; }
        .resume-sheet { border: none !important; box-shadow: none !important; padding: 0 !important; }
    }
    
    /* 📄 গ্লোবাল সিভি টাইপোগ্রাফি সেটিংস */
    .resume-sheet h2 {
        font-size: 1.1rem;
        text-transform: uppercase;
        color: #111;
        border-bottom: 1px solid #333;
        padding-bottom: 4px;
        margin: 25px 0 12px 0;
        letter-spacing: 0.5px;
    }
    .resume-item { margin-bottom: 15px; }
    .resume-item-header { display: flex; justify-content: space-between; align-items: baseline; }
    .resume-item-header h3 { font-size: 1rem; margin: 0; color: #222; }
    .resume-item-header span { font-size: 0.9rem; color: #666; }
    .resume-sub { font-size: 0.95rem; color: #555; margin: 2px 0; font-style: italic; }
    .resume-desc { font-size: 0.9rem; color: #444; margin: 4px 0; line-height: 1.5; text-align: justify; }
</style>
</head>
<body>
    {% include 'navbar.html' %}

    <main class="container mt-4">
        {% block content %}
        
        {% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
