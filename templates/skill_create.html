{% extends 'base.html' %}

{% block content %}
<div class="card p-4 shadow-sm">
    <h2>Add New Skill</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}
        <p>
            <button type="submit" class="btn btn-success mt-3">Save</button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary mt-3">Cancel</a>
        </p>
    </form>
</div>
{% endblock %}
